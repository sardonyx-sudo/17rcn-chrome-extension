<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>扶輪公益網 AI 助手</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    ::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #E2DBD0;
      border-radius: 999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #D0C4B4;
    }

    body {
      width: 380px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang TC', 'Microsoft JhengHei', sans-serif;
      background: #FAF8F5;
      color: #362F29;
      -webkit-font-smoothing: antialiased;
    }

    /* Header */
    .header {
      background: #F4EFEA;
      border-bottom: 1px solid #EAE4DD;
      color: #362F29;
      padding: 13px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .header-icon {
      font-size: 22px;
      line-height: 1;
    }
    .header-text h1 {
      font-size: 14px;
      font-weight: 700;
      color: #2D2620;
      letter-spacing: -0.01em;
    }
    .header-text p {
      font-size: 10.5px;
      color: #7A6E63;
      margin-top: 1px;
      font-weight: 500;
    }

    /* Body */
    .body {
      padding: 14px 16px;
    }

    /* Collapsible Config Card */
    .config-card {
      background: #FFFFFF;
      border-radius: 12px;
      padding: 11px 14px;
      border: 1px solid #EAE4DD;
      margin-bottom: 12px;
      box-shadow: 0 1px 3px rgba(45, 38, 32, 0.03);
    }
    .config-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      user-select: none;
      font-size: 12px;
      font-weight: 700;
      color: #4A3E35;
      transition: color 0.2s;
    }
    .config-header:hover {
      color: #8C6239;
    }
    .config-body {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid #F4EFEA;
    }

    .field-group {
      margin-bottom: 12px;
    }
    .field-group:last-child {
      margin-bottom: 2px;
    }
    label {
      display: block;
      font-size: 11.5px;
      font-weight: 600;
      color: #4A3E35;
      margin-bottom: 5px;
    }
    .input-wrap {
      position: relative;
    }
    input[type="password"],
    input[type="text"],
    select {
      width: 100%;
      padding: 7px 10px;
      border: 1px solid #DED7CD;
      border-radius: 8px;
      font-size: 11.5px;
      background: #FAF8F5;
      color: #362F29;
      transition: all 0.2s ease;
      outline: none;
    }
    input:focus,
    select:focus {
      border-color: #8C6239;
      background: #FFFFFF;
      box-shadow: 0 0 0 3px rgba(140, 98, 57, 0.15);
    }
    .toggle-pw {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      font-size: 13px;
      color: #A89F95;
      padding: 3px;
    }
    .toggle-pw:hover {
      color: #4A3E35;
    }

    .hint {
      font-size: 10.5px;
      color: #7A6E63;
      margin-top: 4px;
      line-height: 1.4;
    }

    /* Switch component */
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .toggle-label {
      margin-bottom: 0;
      font-size: 11.5px;
      font-weight: 600;
      color: #4A3E35;
      cursor: pointer;
    }
    .switch {
      position: relative;
      display: inline-block;
      width: 36px;
      height: 20px;
      flex-shrink: 0;
    }
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #DED7CD;
      transition: 0.25s ease;
      border-radius: 20px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 14px;
      width: 14px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: 0.25s ease;
      border-radius: 50%;
      box-shadow: 0 1px 2px rgba(0,0,0,0.15);
    }
    input:checked + .slider {
      background-color: #8C6239;
    }
    input:checked + .slider:before {
      transform: translateX(16px);
    }

    /* AI Button (Primary CTA) */
    .btn-ai {
      width: 100%;
      padding: 13px 16px;
      background: linear-gradient(135deg, #8C6239 0%, #7B5430 100%);
      color: #FFFFFF;
      border: none;
      border-radius: 12px;
      font-size: 13.5px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 14px rgba(140, 98, 57, 0.3);
      letter-spacing: 0.2px;
    }
    .btn-ai:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(140, 98, 57, 0.4);
      background: linear-gradient(135deg, #976B40 0%, #855C36 100%);
    }
    .btn-ai:active:not(:disabled) {
      transform: translateY(1px) scale(0.99);
      box-shadow: 0 2px 8px rgba(140, 98, 57, 0.25);
    }
    .btn-ai:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    /* Status */
    #status {
      margin-top: 12px;
      font-size: 11.5px;
      border-radius: 10px;
      padding: 0;
      overflow: hidden;
    }
    .status-loading {
      background: #FAF5EB;
      border: 1px solid #E8DCB8;
      color: #6E4E2D;
      padding: 11px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-radius: 10px;
    }
    .status-success {
      background: #EAF4EC;
      border: 1px solid #D1E7D4;
      color: #2D5E34;
      padding: 11px 14px;
      border-radius: 10px;
    }
    .status-error {
      background: #FDF5F5;
      border: 1px solid #F1C3C0;
      color: #83251E;
      padding: 11px 14px;
      border-radius: 10px;
    }
    .status-idle {
      background: #F4EFEA;
      border: 1px solid #E2DBD0;
      color: #5C4F43;
      padding: 11px 14px;
      font-size: 11.5px;
      border-radius: 10px;
    }

    .status-title {
      font-weight: 700;
      margin-bottom: 5px;
      font-size: 12.5px;
    }
    .filled-list {
      list-style: none;
      margin-top: 6px;
    }
    .filled-list li {
      padding: 2px 0;
    }
    .filled-list li::before {
      content: '✓ ';
      color: #4E8752;
      font-weight: bold;
    }

    /* Spinner */
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid #E8DCB8;
      border-top-color: #8C6239;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      flex-shrink: 0;
    }

    /* Not on form page warning */
    .not-on-page {
      background: #FFFBEB;
      border: 1px solid #FDE68A;
      color: #92400E;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 11.5px;
      text-align: center;
      margin-bottom: 12px;
      line-height: 1.4;
    }

    /* Description copy block */
    .desc-block {
      margin-top: 10px;
      background: #FFFFFF;
      border: 1px solid #EAE4DD;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 1px 2px rgba(45, 38, 32, 0.03);
    }
    .desc-block-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 7px 12px;
      background: #F4EFEA;
      border-bottom: 1px solid #EAE4DD;
      font-size: 11.5px;
      font-weight: 700;
      color: #4A3E35;
    }
    .btn-copy {
      background: #8C6239;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-copy:hover { background: #7B5430; }
    .btn-copy.copied { background: #4E8752; }
    .desc-text {
      padding: 9px 12px;
      font-size: 11.5px;
      color: #362F29;
      line-height: 1.5;
      max-height: 90px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-all;
    }

    /* History */
    .history-section {
      border-top: 1px solid #EAE4DD;
      padding: 12px 16px 6px;
    }
    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .history-title {
      font-size: 12px;
      font-weight: 700;
      color: #4A3E35;
    }
    .btn-clear-history {
      background: none;
      border: none;
      font-size: 11px;
      color: #A89F95;
      cursor: pointer;
      padding: 2px 4px;
      transition: color 0.2s;
    }
    .btn-clear-history:hover { color: #83251E; }
    .history-item {
      background: #FFFFFF;
      border: 1px solid #EAE4DD;
      border-radius: 10px;
      padding: 8px 12px;
      margin-bottom: 7px;
      font-size: 11.5px;
      cursor: default;
      box-shadow: 0 1px 2px rgba(45, 38, 32, 0.02);
    }
    .history-item-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }
    .history-item-title {
      font-weight: 700;
      color: #2D2620;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }
    .history-item-meta {
      color: #7A6E63;
      margin-top: 2px;
      font-size: 10.5px;
    }
    .btn-copy-hist {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 14px;
      padding: 0 2px;
      flex-shrink: 0;
      line-height: 1;
      transition: transform 0.1s;
    }
    .btn-copy-hist:hover { transform: scale(1.2); }
    .history-desc {
      margin-top: 5px;
      font-size: 11px;
      color: #5C4F43;
      line-height: 1.45;
      max-height: 48px;
      overflow: hidden;
      text-overflow: ellipsis;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      border-top: 1px solid #F4EFEA;
      padding-top: 4px;
    }
    .history-empty {
      font-size: 11.5px;
      color: #A89F95;
      text-align: center;
      padding: 8px 0 6px;
    }

    /* Footer */
    .footer {
      padding: 9px 16px 11px;
      text-align: center;
      font-size: 10px;
      color: #A89F95;
      border-top: 1px solid #EAE4DD;
      background: #FAF8F5;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="header-icon">🤖</div>
    <div class="header-text">
      <h1>扶輪公益網 AI 助手</h1>
      <p>自動辨識物資，填寫刊登表單</p>
    </div>
  </div>

  <div class="body">
    <!-- 可折疊設定選項 (API Key / 模型 / 地址 / 防衝突) -->
    <div class="config-card">
      <div class="config-header" id="toggleConfig">
        <span>⚙️ 偏好設定 (API Key / 模型 / 地址)</span>
        <span id="configArrow">▼</span>
      </div>
      <div class="config-body" id="configBody" style="display: none;">
        <!-- API Key -->
        <div class="field-group">
          <label for="apiKey">Gemini API Key</label>
          <div class="input-wrap">
            <input type="password" id="apiKey" placeholder="請輸入您的 Gemini API Key">
            <button class="toggle-pw" id="togglePw" title="顯示/隱藏">👁</button>
          </div>
          <div class="hint">
            <a href="https://aistudio.google.com/app/apikey" target="_blank" style="color: #8C6239; font-weight: 600; text-decoration: none;">取得免費 API Key →</a>
          </div>
        </div>

        <!-- AI 辨識模型 (長青雙保險架構) -->
        <div class="field-group">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px;">
            <label for="modelSelect" style="margin-bottom: 0;">AI 辨識模型</label>
            <button id="btnRefreshModels" title="查詢 Google 當前最新可用模型" style="background: none; border: none; color: #8C6239; font-size: 11px; cursor: pointer; font-weight: 700; padding: 2px;">🔄 偵測可用模型</button>
          </div>
          <select id="modelSelect">
            <option value="auto">✨ 自動選擇最新 Flash (推薦)</option>
            <option value="gemini-3.6-flash">gemini-3.6-flash</option>
            <option value="gemini-3.5-flash">gemini-3.5-flash</option>
            <option value="custom">✏️ 自訂模型名稱...</option>
          </select>
          <input type="text" id="customModel" placeholder="例：gemini-3.6-flash" style="display: none; margin-top: 6px;">
          <div class="hint" id="modelHint">自動適配 Google 最新 Flash 模型，舊版退役零影響</div>
        </div>

        <!-- 地址 -->
        <div class="field-group">
          <label for="address">預設所在地址</label>
          <input type="text" id="address" placeholder="例：台北市大安區忠孝東路四段1號">
          <div class="hint">用於自動填寫「所在地址」欄位</div>
        </div>

        <!-- 防重複送出開關 -->
        <div class="field-group">
          <div class="toggle-row">
            <label for="antiDoubleSubmit" class="toggle-label">防送出衝突保護</label>
            <label class="switch">
              <input type="checkbox" id="antiDoubleSubmit" checked>
              <span class="slider"></span>
            </label>
          </div>
          <div class="hint">防止網頁程式重複送出，避免明明已成功刊登卻誤報「驗證碼錯誤」</div>
        </div>
      </div>
    </div>

    <!-- 非表單頁提示 -->
    <div class="not-on-page" id="notOnPage" style="display: none;">
      ⚠️ 請先前往扶輪公益網「刊登資源」頁面
    </div>

    <!-- AI 填寫按鈕 -->
    <button class="btn-ai" id="btnFill">
      <span id="btnIcon">🤖</span>
      <span id="btnText">AI 自動填寫</span>
    </button>

    <!-- 狀態顯示 -->
    <div id="status"></div>
  </div>

  <div class="footer">設定自動儲存於本機 · 不會上傳任何資料</div>

  <!-- 歷史記錄 -->
  <div class="history-section" id="historySection">
    <div class="history-header">
      <span class="history-title">📋 最近查詢記錄</span>
      <button class="btn-clear-history" id="btnClearHistory">清除</button>
    </div>
    <div id="historyList"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
